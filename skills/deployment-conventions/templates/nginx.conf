# deployment-conventions — TLS 종료 + 앱 프록시. 인증서는 고객(병원) 내부 CA 발급본을 certs/ 에 둔다.
# ACME 없음(망분리). 인증서 교체 = 파일 교체 + `docker compose exec nginx nginx -s reload`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location = /health {                     # compose healthcheck 용 — TLS 없이 응답
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;                           # 병원 내부 호스트명으로 교체 (예: ai.hospital.local)

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;     # WebSocket / SSE 도 이 블록으로
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering  off;                                  # 스트리밍 응답
        proxy_read_timeout 300s;
    }
}
