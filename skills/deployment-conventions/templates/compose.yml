# deployment-conventions — single-mode bundle (병원 단독 설치).
# SaaS 에서는 플랫폼이 edge 를 맡으므로 nginx 서비스와 certs 볼륨을 뺀다. 나머지는 동일.
name: ${PRODUCT:-product}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro            # 고객이 fullchain.pem, privkey.pem 을 넣는다
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  app:
    image: ${IMAGE:-ghcr.io/org/product}:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: prod
      TENANCY_MODE: single                     # 테넌트 하나. TENANT_ID 는 .env
      PORT: "8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:                               # 앱 이미지에 curl 이 없어도 되도록 python 으로
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  migrate:                                     # one-shot: alembic upgrade head 후 종료
    image: ${IMAGE:-ghcr.io/org/product}:${TAG:-latest}
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env                             # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  llm:                                         # 선택: 온사이트 OpenAI 호환 LLM. docker compose --profile llm up -d
    image: vllm/vllm-openai:latest             # 반입 시 태그를 고정한다
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "1"                      # 망분리: 모델은 ./models 로 반입
    volumes:
      - ./models:/models:ro
    command: ["--model", "/models/${LLM_MODEL_DIR:-model}", "--served-model-name", "${LLM_MODEL:-default}"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  db-data:
    name: ${PRODUCT:-product}-db-data
  redis-data:
    name: ${PRODUCT:-product}-redis-data
